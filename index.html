<body>
<div class="app" id="app">
    <div class="header">
        <div class="header-left">
            <h1>🩺 COMMUNITY HEALTH <span>RETAKE 2023...1</span></h1>

        </div>
        <div class="counter" id="counter">1/53</div>
    </div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="main">
        <div class="chapter-indicator" id="chapterDisplay">
            <i id="chapterIcon">📗</i>
            <span id="chapterName">Community Health</span>
            <span class="badge" id="qTypeBadge">Single</span>
            <span id="resultTag" class="result-tag"></span>
        </div>
        <div class="question-area" id="questionArea">
            <div class="question-header">
                <div class="question-number" id="questionNumber">1</div>

            </div>
            <div class="options-container" id="options"></div>
            <div id="selectedCount" class="selected-indicator"></div>
            <div class="rationale" id="rationale">

            <button class="btn btn-primary" id="nextBtn" onclick="nextCard()">Next →</button>
        </div>
    </div>
</div>

<!-- Chapter Modal -->

            <button class="modal-close" onclick="closeChapterModal()">✕</button>

            <input type="text" id="chSearch" placeholder="🔍 Search..." oninput="filterChapters(this.value)" />
        </div>
        <div class="modal-body" id="chapterGrid"></div>
    </div>
</div>

<script>
(function() {
    var currentQuestion = 0;
    var selectedOptions = [];
    var answered = false;

    var questions = [
        {q:"A home health nurse is visiting a client who has colon cancer. The client states, 'I do not want any further treatment.' Which of the following actions should the nurse take?", opts:["Discuss the client's wishes with their provider.","Ask the client why they do not want to continue treatment.","Instruct the client that they need to change their advance directives first.","Request a referral for a social worker."], correct:[1], rationale:"The nurse should first explore the client's rationale, fears, or physical symptoms driving this decision, providing an open space for dialogue and ensuring the client is making a fully informed decision. Discussing with provider, instructing about advance directives, or requesting social work referral are subsequent steps.", chapter:1, chapName:"Palliative Care", displayNumber:1},
        {q:"An occupational health nurse is planning health promotion activities for a group of workers in a local manufacturing plant. Which of the following are secondary prevention activities the nurse should plan to include? (Select all that apply)", opts:["Educate the workers on the importance of safety goggles.","Demonstrate proper lifting techniques for the workers.","Encourage the workers to use back braces provided by the employer.","Refer workers who report difficulty hearing for further auditory testing.","Conduct visual screenings for workers operating equipment."], correct:[3,4], rationale:"Secondary prevention focuses on early detection and screening. Referral for auditory testing and visual screenings are secondary prevention. Education on safety goggles, demonstrating lifting techniques, and encouraging back braces are primary prevention.", chapter:1, chapName:"Prevention Levels", displayNumber:2},
        {q:"A home health nurse is providing teaching to the guardian of a child who has leukemia about methods to prevent complications. Which of the following statements by the guardian indicates an understanding of the teaching?", opts:["'I should take my child's rectal temperature daily.'","'I will make sure my child gets a measles, mumps, and rubella vaccine this week.'","'I'm sure my child will feel better now that he can ride his bicycle.'","'I should inspect my child's mouth for sores.'"], correct:[3], rationale:"Chemotherapy causes neutropenia, placing the child at risk for infections. Regular oral assessments help detect mucositis or thrush. Rectal temperatures, live vaccines (MMR), and high-injury activities (bike riding) are contraindicated.", chapter:1, chapName:"Oncology Care", displayNumber:3},
        {q:"A home health nurse is visiting a client who has a new diagnosis of diabetes mellitus. Which of the following actions should the nurse take first?", opts:["Identify the client's dietary preferences.","Develop a nutritional program.","Teach the client about appropriate food choices.","Refer the client to a diabetes mellitus support group."], correct:[0], rationale:"Identifying dietary preferences is the first step to understand the client's habits and tailor a realistic, sustainable nutritional plan. Developing a program, teaching food choices, and referral are subsequent steps.", chapter:1, chapName:"Home Health", displayNumber:4},
        {q:"A home health nurse is providing teaching to a client and their family about hospice care. Which of the following information should the nurse include in the teaching?", opts:["Hospice programs are designed for clients who have 9 months or fewer to live.","Hospice care allows families to participate in the client's care.","Hospice services end when the client dies.","Hospice care will provide life-extending interventions."], correct:[1], rationale:"Hospice care encourages active family participation in care delivery. Hospice typically requires a 6-month (not 9-month) prognosis, services include bereavement support after death, and focuses on comfort (not life extension).", chapter:1, chapName:"Hospice Care", displayNumber:5},
        {q:"During a routine school visit to a physical education class, a nurse receives multiple reports of shortness of breath, coughing, and nausea. Which of the following actions should the nurse take first?", opts:["Notify the parents of the students.","Administer oxygen therapy.","Contact the local health department.","Establish a triage area."], correct:[3], rationale:"Establishing a triage area is the priority to assess and organize the situation, ensuring the most severe cases are managed first. Notifying parents, administering oxygen, and contacting health authorities are subsequent steps.", chapter:1, chapName:"Emergency Response", displayNumber:6},
        {q:"A community health nurse is planning to use web-based information resources in the care of a client who is undergoing dialysis. Which of the following criteria should the nurse consider in selecting appropriate resources for the client?", opts:["The website is updated every 5 years.","The website is hosted by a dialysis equipment marketing group.","The website is sponsored by a health care political action committee.","The website provides a peer-review process for publishing information."], correct:[3], rationale:"A peer-review process ensures information is vetted by experts, enhancing credibility and accuracy. Marketing sponsorships or political committees introduce bias, and updates should occur more frequently than every 5 years.", chapter:1, chapName:"Health Education", displayNumber:7},
        {q:"A community health nurse notes that 11 new cases of diabetes mellitus have been reported in the past 3 months. In the previous year, 5 cases were reported. The population of the community is 15,000 people. Which of the following is the prevalence proportion for the community?", opts:["73.3/100,000","33.3/100,000","0.1/100,000","40.0/100,000"], correct:[0], rationale:"Prevalence tracks all existing cases. Total cases = 5 (old) + 11 (new) = 16 cases. Prevalence = (16/15,000) × 100,000 = 106.7 per 100,000. However, based on the options, the calculation appears to be for incidence. Using 11 cases: (11/15,000) × 100,000 = 73.3 per 100,000.", chapter:1, chapName:"Epidemiology", displayNumber:8},
        {q:"A nurse is assessing an outbreak of mumps among school-age children. Using the epidemiological triangle, the nurse should recognize that which of the following is the host?", opts:["The children","The school","The virus","The vaccine"], correct:[0], rationale:"The host is the living organism affected by the disease. The children are the host. The virus is the agent, the school is the environment, and the vaccine is an intervention.", chapter:1, chapName:"Epidemiology", displayNumber:9},
        {q:"A nurse is teaching a client who has a terminal illness about hospice care. Which of the following statements by the client indicates an understanding of the teaching? (Select all that apply)", opts:["'I will receive care from a variety of interprofessional team members.'","'I will need to have private insurance because Medicare does not cover hospice services.'","'I can discontinue hospice care whenever I want.'","'I can receive care in the hospital or at home.'","'My provider will recommend that I enter hospice care when I have 1 year left to live.'"], correct:[0,2,3], rationale:"Hospice involves interprofessional care, clients can discontinue anytime, and care can be delivered at home or hospital. Medicare covers hospice, and the prognosis requirement is typically 6 months (not 1 year).", chapter:1, chapName:"Hospice Care", displayNumber:10},
        {q:"A faith community nurse is planning care for a client who has been diagnosed with end-stage breast cancer. Which of the following interventions should the nurse include in the plan?", opts:["Place the client's name and medical condition on an online prayer chain.","Recommend the client seek out hospice services rather than seek treatment.","Initiate topics of conversation that avoid the client's health status.","Provide quiet time during visits for prayer or meditation."], correct:[3], rationale:"Providing quiet time for prayer or meditation respects the client's spiritual needs. Posting medical information online violates privacy, treatment decisions are the client's choice, and avoiding health status discussions is not client-centered.", chapter:1, chapName:"Spiritual Care", displayNumber:11},
        {q:"A case manager in a rehabilitation facility is discussing discharge plans with a client who has a pressure injury and requires a special bed at home. Which of the following statements should the nurse make first?", opts:["Apply moisture barrier ointment three times a day.","Eat a balanced diet with high-protein snacks.","Determine the place where you are currently living.","A social worker can help you with the cost of supplies."], correct:[2], rationale:"Assessing the home environment is the first step to determine if the special bed can be accommodated. Applying ointment, nutritional advice, and social work are subsequent steps.", chapter:1, chapName:"Case Management", displayNumber:12},
        {q:"A community health nurse is developing a disaster-preparedness plan. Which of the following actions should the nurse take first when developing the plan?", opts:["Provide education about first aid and triage.","Identify the community's risks and capabilities.","Evaluate the effectiveness of local disaster-preparedness drills.","Assemble an emergency disaster response team."], correct:[1], rationale:"Assessment of community risks and capabilities is the first step in disaster planning. Education, evaluating drills, and assembling teams are subsequent steps.", chapter:1, chapName:"Disaster Planning", displayNumber:13},
        {q:"Which of the following federal agencies should a community health nurse seek guidance from regarding a public building that has asbestos leaking from rips in the heating duct insulation?", opts:["Department of Health and Human Services","National Institutes of Health","Environmental Protection Agency","Centers for Disease Control and Prevention"], correct:[2], rationale:"The Environmental Protection Agency (EPA) is the federal authority responsible for regulating environmental hazards like asbestos. CDC handles disease prevention, NIH handles research, and HHS handles health programs.", chapter:1, chapName:"Environmental Health", displayNumber:14},
        {q:"A school nurse is assessing a child and discovers Koplik spots on the child's buccal mucosa. Which of the following actions should the nurse take?", opts:["Review the immunization records of the child's classmates.","Ask the caregivers if the child recently used alcohol-based mouthwash.","Instruct the caregivers to increase the child's Vitamin B12 intake.","Check the child's classmates for parotid gland enlargement."], correct:[0], rationale:"Koplik spots indicate measles (rubeola). Reviewing classmates' immunization records is essential for outbreak control. Mouthwash doesn't cause Koplik spots, Vitamin B12 is not relevant, and parotid enlargement indicates mumps.", chapter:1, chapName:"Infectious Disease", displayNumber:15},
        {q:"A home health nurse is explaining a HIPAA acknowledgement form to a client in preparation for them to sign it. Which of the following information should the nurse provide?", opts:["'Your health care provider will assist you in making decisions about who to disclose your health information to.'","'Assistive personnel will be able to access your prior admission information.'","'You can share your current medical information with providers who are involved in your care.'","'The billing department at the agency will have access to your entire medical record.'"], correct:[2], rationale:"Under HIPAA, protected health information can be shared among actively collaborating providers without separate consent. Providers assist with disclosures, assistive personnel need justification, and billing departments don't get unrestricted access.", chapter:1, chapName:"HIPAA & Ethics", displayNumber:16},
        {q:"A first-response team is working at the location of a bombing incident. A nurse triaging a group of clients should give treatment priority to which of the following clients?", opts:["A client who has a femur fracture with a 2+ pedal pulse.","A client who has a rigid abdomen with manifestations of shock.","A client who has superficial partial-thickness burns over 5% of his body.","A client who is ambulatory and exhibits manic behavior."], correct:[1], rationale:"A rigid abdomen with shock indicates internal bleeding, which is immediately life-threatening but treatable (red tag). Femur fracture with intact pulses is yellow, small burns are green, and ambulatory manic behavior is green.", chapter:1, chapName:"Disaster Triage", displayNumber:17},
        {q:"A nurse is counseling a client who has advanced-stage lung cancer about the use of palliative care. Which of the following client statements indicates an understanding of the information?", opts:["'If I choose palliative care, I can only go to the hospital if I stop breathing.'","'The purpose of palliative care is to provide comfort measures for cancer.'","'I need to stop treatments for my cancer before beginning palliative care.'","'If my oncologist recommends palliative care, it means that I have about 6 months or less to live.'"], correct:[1], rationale:"Palliative care focuses on comfort and quality of life and can be provided alongside curative treatments. It is not restricted to a 6-month prognosis and does not require stopping other treatments.", chapter:1, chapName:"Palliative Care", displayNumber:18},
        {q:"A nurse is serving on a state task force for disaster planning. The nurse is engaging in disaster preparedness efforts when performing which of the following actions?", opts:["Organizing a mass-casualty drill for community members.","Implementing a disaster triage plan with a local medical facility.","Assisting with the identification of a biological agent.","Functioning as a manager at a temporary shelter."], correct:[0], rationale:"Organizing drills is a preparedness activity. Implementing triage plans and identifying agents are response activities, and managing a shelter is a response activity.", chapter:1, chapName:"Disaster Planning", displayNumber:19},
        {q:"A public health nurse is developing a protocol for treatment of inhalation anthrax in the event of widespread public exposure. Which of the following information should the nurse plan to include?", opts:["Ciprofloxacin should be administered for asymptomatic clients who were directly exposed to anthrax.","Prophylactic treatment should be provided to clients for 10 days following exposure to anthrax.","Manifestations of anthrax infection appear within 3 days of exposure.","The anthrax vaccine is ineffective following direct anthrax exposure."], correct:[0], rationale:"Ciprofloxacin is the standard for post-exposure prophylaxis in asymptomatic exposed individuals. Prophylaxis must continue for 60 days, symptoms can take weeks to appear, and vaccine is not used for post-exposure.", chapter:1, chapName:"Bioterrorism", displayNumber:20},
        {q:"A public health nurse learns that a client is being treated for active tuberculosis. Which of the following actions should the nurse take to prevent the spread of tuberculosis within the community?", opts:["Perform tuberculosis screenings throughout the community.","Provide education to the community about the manifestations of tuberculosis.","Ensure client adherence to the medication regimen.","Report the active case to the public health department."], correct:[3], rationale:"Reporting active TB cases is legally mandated to initiate contact tracing and containment. Screenings, education, and adherence monitoring are secondary measures.", chapter:1, chapName:"Tuberculosis", displayNumber:21},
        {q:"A home health nurse is visiting a client who is recovering from a stroke. The client's adult child has taken on the role of caregiver. Which of the following statements indicates they are adapting to their role change?", opts:["'I apologize for the dishes piling up in the kitchen sink.'","'I will need financial assistance if I don't get back to my job soon.'","'I am still trying to rearrange the furniture so they can use their walker.'","'I have a neighbor coming over so I can go get my hair cut and styled.'"], correct:[3], rationale:"Arranging respite care for personal wellness demonstrates healthy adaptation. Apologizing for chores, financial worry, and ongoing home modifications indicate role strain.", chapter:1, chapName:"Caregiver Support", displayNumber:22},
        {q:"A school nurse is planning safety education for a group of adolescents. The nurse should give priority to which of the following topics as the leading cause of death for this age group?", opts:["Motor vehicle safety","Sports injury prevention","Gun safety","Substance abuse prevention"], correct:[0], rationale:"Motor vehicle accidents are the leading cause of death among adolescents, making this the priority topic for safety education.", chapter:1, chapName:"School Health", displayNumber:23},
        {q:"A nurse is working with a case manager for a client who participates in a health maintenance organization. The nurse should identify that a health maintenance organization provides which of the following payment structures?", opts:["The provider is paid a fixed sum for the client on a monthly or yearly basis.","The client pays the insurer a percentage of the total costs for each service rendered by the provider.","The client is participating in a fee-for-service health care insurance program.","The provider bills the client directly for a predetermined percentage of the cost of services."], correct:[0], rationale:"HMOs use capitation: fixed payment per enrolled member regardless of services used. This encourages preventive care. Fee-for-service and co-insurance are characteristic of other payment models.", chapter:1, chapName:"Healthcare Systems", displayNumber:24},
        {q:"A nurse is working in a shelter following a disaster. Which of the following is the priority action for the nurse to take?", opts:["Create diversionary activities for children.","Help clients gather needed supplies.","Explore feelings the clients are experiencing.","Address the physical needs of clients."], correct:[3], rationale:"Addressing immediate physical needs (safety, food, water, medical care) is the priority according to Maslow's hierarchy. Emotional support, supplies, and diversion are secondary.", chapter:1, chapName:"Disaster Response", displayNumber:25},
        {q:"A nurse is conducting discharge planning for several clients. When reviewing information to report to other members of the interprofessional team, which of the following actions is the nurse's priority?", opts:["Request a dietitian consult for a client who asks for information about a vegan diet.","Inform the physical therapist of activity restrictions for a client following a hip arthroplasty.","Notify spiritual support personnel about a client who requests a visit.","Ask social services to inform a client about community support organizations."], correct:[1], rationale:"Communicating activity restrictions to physical therapy is the priority to prevent injury or dislocation during rehabilitation. Dietary, spiritual, and social needs are important but not immediate safety priorities.", chapter:1, chapName:"Interprofessional Care", displayNumber:26},
        {q:"A nurse in a health department is participating in an immunization clinic. The nurse should identify that which of the following children requires an alteration in the standard immunization schedule?", opts:["An 18-month-old toddler who has failure to thrive.","A 4-month-old infant who has Down syndrome.","A 12-month-old infant who has sickle cell disease.","A 3-year-old toddler who has leukemia."], correct:[3], rationale:"Children with leukemia are immunocompromised and cannot safely receive live vaccines, requiring an altered schedule. Down syndrome, sickle cell disease, and failure to thrive do not universally contraindicate standard vaccines.", chapter:1, chapName:"Immunizations", displayNumber:27},
        {q:"A nurse is working for a hospice organization. The nurse should identify that which of the following criteria must be met for a client to qualify for hospice care?", opts:["The client requires inpatient care due to lack of a caregiver.","The client's insurance provides coverage for palliative care.","The client has documentation stating he has less than 12 months to live.","The client has declined additional life-prolonging treatments."], correct:[3], rationale:"To qualify for hospice, the client must choose to forgo curative, life-prolonging interventions in favor of comfort care. Hospice can be managed at home, and the prognosis is typically 6 months (not 12).", chapter:1, chapName:"Hospice Care", displayNumber:28},
        {q:"A nurse at a local health department is caring for several clients. Which of the following infections should the nurse report to the state health department?", opts:["Human papillomavirus","Herpes simplex virus","Chlamydia","Group B streptococcus"], correct:[2], rationale:"Chlamydia is a nationally reportable STI that must be reported to state health departments. HPV, HSV, and Group B strep are not nationally notifiable conditions.", chapter:1, chapName:"Public Health Reporting", displayNumber:29},
        {q:"A nurse manager at a clinic is reviewing the preventative services offered to clients. Which of the following activities should the nurse identify as a secondary prevention activity?", opts:["Encourage a pregnant client to participate in prenatal care.","Advocate for laws that prohibit texting while driving.","Refer a client who is recovering from a substance use disorder to a social service program.","Provide a smoking cessation class."], correct:[0], rationale:"Prenatal care involves screening and early detection of complications, making it secondary prevention. Advocacy and smoking cessation are primary, and referral to social services is tertiary.", chapter:1, chapName:"Prevention Levels", displayNumber:30},
        {q:"A community health nurse is discussing advance directives with a client. The nurse should identify that which of the following statements made by the client indicates an understanding of the purpose of advance directives?", opts:["They help to uphold the ethical principle of veracity.","They ease the difficult decisions faced by those involved in my care.","They decrease the potential for receiving palliative care.","They detail my doctors' decisions about my end-of-life care."], correct:[1], rationale:"Advance directives outline the client's choices, easing the burden on family and providers. They do not limit palliative care, do not uphold veracity directly, and reflect client (not doctor) decisions.", chapter:1, chapName:"End-of-Life Care", displayNumber:31},
        {q:"A nurse is caring for a client who is without housing. Which of the following actions should the nurse take first?", opts:["Develop client teaching using a variety of strategies.","Determine the client's understanding of their living situation.","Assist the client to develop goals for obtaining shelter.","Discuss the risks of being without housing with the client."], correct:[1], rationale:"Assessing the client's perception of their situation is the first step to build trust and tailor interventions. Developing teaching, setting goals, and discussing risks are subsequent steps.", chapter:1, chapName:"Vulnerable Populations", displayNumber:32},
        {q:"A school nurse is planning primary prevention activities for the new school year. Which of the following should the nurse include? (Select all that apply)", opts:["Teaching a class about the risks of cigarette smoking.","Recommending a seating arrangement for a child in a body cast.","Creating a plan of care for children who have a diagnosis of diabetes mellitus.","Organizing a program to promote skateboard safety.","Lobbying for funding for health promotion efforts."], correct:[0,3,4], rationale:"Primary prevention prevents disease/injury before it occurs. Smoking education, skateboard safety, and lobbying are primary. Seating arrangements and diabetes care plans are secondary/tertiary.", chapter:1, chapName:"Prevention Levels", displayNumber:33},
        {q:"A nurse at a community mental health center is teaching a course for the family and friends of clients who have a gambling disorder. Which of the following statements by a participant indicates an understanding of the information?", opts:["'Gambling behaviors can increase during times of stress.'","'There is no genetic link to an increased risk for a gambling disorder.'","'A person must gamble at least four to six times per month to have a gambling disorder.'","'Family members should provide financial assistance during times of increased gambling.'"], correct:[0], rationale:"Compulsive gambling often escalates during stress as a coping mechanism. There is a genetic link, frequency alone doesn't define the disorder, and financial assistance enables the behavior.", chapter:1, chapName:"Mental Health", displayNumber:34},
        {q:"A newly hired occupational health nurse is assessing hazards in the work environment. Which of the following actions will help the nurse detect potential physical hazards?", opts:["Measure noise levels at various locations in the facility.","Track rates of illness caused by infection among employees.","Identify industrial toxins that are present in the environment.","Survey workers about job-related emotional stress."], correct:[0], rationale:"Physical hazards are environmental energy sources (noise, radiation, temperature extremes). Measuring noise levels detects physical hazards. Toxins are chemical, infections are biological, and stress is psychosocial.", chapter:1, chapName:"Occupational Health", displayNumber:35},
        {q:"A nurse educator is teaching a group of newly licensed nurses about maintaining client confidentiality according to HIPAA regulations. Which of the following statements by a newly licensed nurse indicates an understanding of the teaching?", opts:["'HIPAA rules vary from state to state.'","'A client's diagnosis can be posted on the communication board inside the client's room.'","'We should share our computer passwords with our managers.'","'HIPAA rules allow clients to receive a copy of their medical records.'"], correct:[3], rationale:"HIPAA guarantees clients the right to access their medical records. HIPAA is uniform federal law, posting diagnoses violates privacy, and passwords should never be shared.", chapter:1, chapName:"HIPAA & Ethics", displayNumber:36},
        {q:"A nurse case manager is providing discharge planning for a client. The nurse is functioning in the role of coordinator when arranging for the delivery of medical equipment to the client's home?", opts:["Coordinator","Advocate","Consultant","Systems allocator"], correct:[0], rationale:"The coordinator role involves organizing logistics and linking device vendors to ensure smooth transition. Advocacy protects patient rights, and consultants offer expert guidance.", chapter:1, chapName:"Case Management", displayNumber:37},
        {q:"A community health nurse is planning care for a group of migrant workers. The nurse should plan to engage in which of the following activities when assessing the clients' culture?", opts:["Interview community leaders for a perspective of community life.","Ask for assistance from local spiritual leaders if there is a language barrier.","Collect all the data on the first visit with the workers.","Incorporate one's implicit bias into planned delivery of care."], correct:[0], rationale:"Key informant interviews with community leaders provide accurate cultural insights. Language barriers require trained interpreters, not spiritual leaders; data collection should be ongoing, and biases must be recognized and set aside.", chapter:1, chapName:"Cultural Competence", displayNumber:38},
        {q:"A home health nurse is assessing the health history of a new client. The nurse should identify that which of the following conditions increases the client's risk for falls?", opts:["Chronic obstructive pulmonary disease","Chronic kidney disease","Osteoarthritis","Wide-angle glaucoma"], correct:[2], rationale:"Osteoarthritis causes joint pain and stiffness that impair gait and balance, increasing fall risk. COPD, CKD, and glaucoma affect health but have less direct impact on gait stability.", chapter:1, chapName:"Home Safety", displayNumber:39},
        {q:"A home health nurse is reviewing a list of staff activities for the upcoming month. The nurse should identify that which of the following activities will provide feedback regarding care quality?", opts:["Orienting staff members to a new piece of equipment that will be used in the home setting.","Teaching clients' family members how to care for a wound in the home setting.","Organizing an event to improve the morale of the home health staff.","Tracking the number of postoperative clients who are readmitted to the acute care facility."], correct:[3], rationale:"Tracking readmission rates is an objective quality indicator. Equipment orientation, teaching, and morale events do not directly measure care quality.", chapter:1, chapName:"Quality Improvement", displayNumber:40},
        {q:"A hospice nurse is planning care for a client who is near death. Which of the following actions should the nurse include in the client's plan of care to promote the client's comfort?", opts:["Offer the client ice chips.","Elevate the head of the client's bed.","Turn the client every 4 hr.","Provide oral care to the client every 6 hr."], correct:[1], rationale:"Elevating the head of the bed eases breathing and reduces dyspnea. Ice chips may be appropriate but not always, rigid turning schedules can cause distress, and oral care should be more frequent.", chapter:1, chapName:"Hospice Care", displayNumber:41},
        {q:"An occupational health nurse at a factory is planning upcoming health programs for employees. Which of the following actions demonstrates the use of secondary prevention strategies?", opts:["Screening employees who were exposed to high levels of noise for hearing loss.","Providing education about safety and injury prevention for employees.","Providing nutrition education to employees who have a BMI of greater than 30.","Coordinating disaster planning efforts at the factory."], correct:[0], rationale:"Screening for hearing loss in exposed workers is secondary prevention (early detection). Safety education and nutrition education are primary, and disaster planning is preparedness.", chapter:1, chapName:"Occupational Health", displayNumber:42},
        {q:"A nurse in a community health clinic is assessing a client who has two preschoolers, was recently divorced, and is seeking help for managing depression. Which of the following questions should the nurse ask first?", opts:["'Who is available to help you?'","'Could you describe how you are feeling today?'","'Are you having any thoughts about hurting yourself?'","'Is there anything that makes you feel less depressed?'"], correct:[2], rationale:"Safety is the priority. The nurse must ask about suicidal ideation first to assess for immediate risk. Exploring support, mood, and coping are secondary assessments.", chapter:1, chapName:"Mental Health", displayNumber:43},
        {q:"A school nurse is reviewing the family history of a school-age child who has a fractured ulna for the second time. Which of the following findings place the child at risk for child abuse? (Select all that apply)", opts:["One of the child's parents appears frightened of the other parent.","Neither of the child's parents are financially stable.","One of the child's parents has a history of alcohol use disorder.","The child spends the weekends with their grandparents.","The child's family has an indoor cat that sleeps with the child."], correct:[0,1,2], rationale:"Domestic violence (fear between parents), financial instability, and parental substance abuse are abuse risk factors. Grandparents and pets are not risk factors.", chapter:1, chapName:"Child Abuse", displayNumber:44},
        {q:"A nurse is providing teaching to a 50-year-old female client. Which of the following statements should the nurse include in the teaching?", opts:["'You should have a complete eye examination every 2 years until the age of 64.'","'You should have your fasting blood glucose level checked every 6 years.'","'You should have your hearing screened every 5 years.'","'You should have your stool tested for blood every other year until the age of 74.'"], correct:[3], rationale:"Stool-based screening (FOBT/FIT) is recommended every 1-2 years for adults aged 50-75 to detect colorectal cancer. Eye exams are recommended more frequently, glucose checks are every 3 years if overweight, and hearing screening is not routine.", chapter:1, chapName:"Preventive Health", displayNumber:45},
        {q:"A community health nurse is teaching a group of clients about resources to assist with recovery following a stroke. Which of the following resources should the nurse recommend for clients who are experiencing dysphagia?", opts:["Restorative aide","Occupational therapist","Physical therapist","Speech-language pathologist"], correct:[3], rationale:"Speech-language pathologists specialize in evaluating and treating swallowing disorders (dysphagia). Physical therapists focus on mobility, occupational therapists on ADLs, and restorative aides assist with exercises.", chapter:1, chapName:"Stroke Rehabilitation", displayNumber:46},
        {q:"A nurse working in an infectious disease clinic is caring for a client who has a new diagnosis of Lyme disease. Which of the following agencies is responsible for voluntarily reporting cases of this disease to the Centers for Disease Control and Prevention?", opts:["Hospital infection control department","State health department","Office of the Surgeon General","Local Red Cross chapter"], correct:[1], rationale:"State health departments collect and transmit reportable disease data to the CDC. Hospitals record internal data but do not handle state-to-federal reporting.", chapter:1, chapName:"Public Health Reporting", displayNumber:47},
        {q:"An occupational health nurse is planning a program on early detection of breast cancer for employees at a local business. Which of the following is the first action the nurse should take?", opts:["Develop educational materials for employees.","Schedule a guest speaker to talk about breast cancer to employees.","Determine employee knowledge level of breast self-examination.","Have breast models available to employees during teaching sessions."], correct:[2], rationale:"Assessing the target learners' current knowledge is the first step to identify gaps and tailor the program. Developing materials, scheduling speakers, and having models are implementation steps.", chapter:1, chapName:"Health Education", displayNumber:48},
        {q:"A home health nurse is assessing a client who has AIDS. Which of the following statements by the client indicates a risk for suicide?", opts:["'I am relying more and more on my partner for support.'","'I know that everything will be better soon.'","'I am afraid of experiencing pain near the end.'","'I don't want to lose control of my ability to make decisions.'"], correct:[1], rationale:"Vague, overly positive statements like 'everything will be better soon' can indicate hopelessness or suicidal ideation. Relying on support, fear of pain, and concerns about decision-making are normal responses.", chapter:1, chapName:"Mental Health", displayNumber:49},
        {q:"A faith community nurse is preparing to meet with the family of an adolescent who has leukemia. Which of the following actions should the nurse plan to take?", opts:["Focus the discussion on the adolescent's future career plans.","Direct conversation to the parents to avoid embarrassing the adolescent.","Determine how the adolescent's health has affected family roles.","Ask another family from the same faith congregation to attend the meeting for support."], correct:[2], rationale:"Assessing how the illness has impacted family roles helps identify stressors and plan interventions. Focusing on career plans, excluding the adolescent, or inviting other families are not appropriate.", chapter:1, chapName:"Family Nursing", displayNumber:50},
        {q:"A teacher suspects a child is being maltreated at home and takes them to the school nurse. Which of the following findings should the nurse report as an indication of possible maltreatment?", opts:["The child receives free lunches at school.","The child reports having a toothache.","The child has recent onset of urinary incontinence.","The child has bruises on both knees."], correct:[2], rationale:"Sudden onset of urinary incontinence in a school-age child can indicate severe stress or trauma. Free lunches relate to socioeconomic status, toothache is medical, and bruises on knees are common in active children.", chapter:1, chapName:"Child Abuse", displayNumber:51},
        {q:"A home health nurse is providing teaching to a client who has diabetes mellitus about proper disposal of insulin syringes. Which of the following statements by the client indicates an understanding of the teaching?", opts:["'I will store used syringes in a biohazard bag before discarding.'","'I will discard the syringes in a metal container.'","'I will containerize used syringes to bring to the local recycling center.'","'I will wear gloves when I discard the syringes.'"], correct:[1], rationale:"Sharps must be discarded in a puncture-resistant metal or rigid plastic container. Biohazard bags don't prevent punctures, recycling centers don't accept sharps, and wearing gloves is not the primary safety measure.", chapter:1, chapName:"Home Health", displayNumber:52},
        {q:"A nurse in a public health department is caring for a client. Which of the following data in the client's medical record should cause the nurse to suspect the client is infected with the plague? (Select all that apply)", opts:["Client statement about 'flea bites'","Temperature","Lymph node assessment","Travel history","Client report of myalgia"], correct:[0,2,3], rationale:"Bubonic plague is transmitted via flea bites, presents with tender swollen lymph nodes (buboes), and requires travel history to endemic areas. Fever and myalgia are non-specific symptoms that occur with many conditions.", chapter:1, chapName:"Infectious Disease", displayNumber:53}
    ];

    var chapterList = [
        {ch:1, name:"Community Health & Nursing", count: questions.filter(function(q){return q.chapter===1;}).length}
    ];

    var chapterIndex = {};
    questions.forEach(function(q, idx) {
        if (!chapterIndex[q.chapter]) chapterIndex[q.chapter] = {firstIdx: idx};
    });

    function isMultiSelect(q) { return q.correct.length > 1; }

    function updateSelectedCount() {
        var q = questions[currentQuestion];
        var el = document.getElementById('selectedCount');
        if (isMultiSelect(q) && !answered) {
            el.textContent = selectedOptions.length > 0 ? 'Selected: ' + selectedOptions.length + ' of ' + q.correct.length + ' correct answers' : 'Select all that apply';
        } else { el.textContent = ''; }
    }

    function selectOption(idx) {
        if (answered) return;
        var q = questions[currentQuestion];
        if (isMultiSelect(q)) {
            var pos = selectedOptions.indexOf(idx);
            if (pos === -1) { selectedOptions.push(idx); }
            else { selectedOptions.splice(pos, 1); }
            var opts = document.querySelectorAll('.option');
            opts.forEach(function(o, i) {
                o.classList.toggle('selected', selectedOptions.indexOf(i) !== -1);
            });
            updateSelectedCount();
            var cancelBtn = document.getElementById('cancelBtn');
            if (selectedOptions.length > 0) { cancelBtn.classList.add('show'); }
            else { cancelBtn.classList.remove('show'); }
            if (selectedOptions.length === q.correct.length) {
                document.getElementById('nextBtn').disabled = false;
                submitAnswer();
            }
        } else {
            selectedOptions = [idx];
            var opts = document.querySelectorAll('.option');
            opts.forEach(function(o, i) { o.classList.toggle('selected', i === idx); });
            updateSelectedCount();
            document.getElementById('cancelBtn').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
            submitAnswer();
        }
    }

    function submitAnswer() {
        answered = true;
        var q = questions[currentQuestion];
        var isCorrect = selectedOptions.length === q.correct.length &&
            selectedOptions.every(function(i){ return q.correct.indexOf(i) !== -1; });
        var opts = document.querySelectorAll('.option');
        opts.forEach(function(o, i) {
            o.classList.remove('selected');
            if (q.correct.indexOf(i) !== -1) { o.classList.add('correct'); }
            else if (selectedOptions.indexOf(i) !== -1) { o.classList.add('incorrect'); }
            o.classList.add('disabled');
        });
        var tag = document.getElementById('resultTag');
        tag.textContent = isCorrect ? '✓ Correct' : '✗ Incorrect';
        tag.className = 'result-tag ' + (isCorrect ? 'correct' : 'incorrect');
        document.getElementById('rationaleText').textContent = q.rationale;
        document.getElementById('rationale').classList.add('show');
        document.getElementById('cancelBtn').classList.remove('show');
        document.getElementById('nextBtn').disabled = false;
    }

    function cancelSelection() {
        selectedOptions = [];
        var opts = document.querySelectorAll('.option');
        opts.forEach(function(o) { o.classList.remove('selected','correct','incorrect','disabled'); });
        document.getElementById('rationale').classList.remove('show');
        document.getElementById('resultTag').innerHTML = '';
        document.getElementById('resultTag').className = 'result-tag';
        document.getElementById('cancelBtn').classList.remove('show');
        document.getElementById('nextBtn').disabled = true;
        answered = false;
        updateSelectedCount();
    }

    function skipQuestion() {
        if (!answered) {
            cancelSelection();
        }
        nextCard();
    }

    function nextCard() {
        if (currentQuestion < questions.length - 1) { currentQuestion++; loadQuestion(); }
        else { currentQuestion = 0; loadQuestion(); }
    }

    function previousCard() {
        if (currentQuestion > 0) { currentQuestion--; loadQuestion(); }
    }

    function randomCard() {
        var idx;
        do { idx = Math.floor(Math.random() * questions.length); }
        while (idx === currentQuestion && questions.length > 1);
        currentQuestion = idx;
        loadQuestion();
    }

    function buildChapterGrid() {
        var grid = document.getElementById('chapterGrid');
        grid.innerHTML = '';
        var currentCh = questions[currentQuestion].chapter;
        chapterList.forEach(function(item) {
            var ch = item.ch;
            var card = document.createElement('div');
            card.className = 'ch-card' + (ch === currentCh ? ' active' : '');
            card.id = 'ch-card-' + ch;
            card.setAttribute('data-name', ('chapter ' + ch + ' ' + item.name).toLowerCase());
            card.innerHTML = '<div class="ch-num">' + ch + '</div><div class="ch-info"><div class="ch-title">Ch ' + ch + ': ' + item.name + '</div><div class="ch-count">' + item.count + ' questions</div></div>';
            card.onclick = (function(c){ return function(){ jumpToChapter(c); }; })(ch);
            grid.appendChild(card);
        });
        var active = document.getElementById('ch-card-' + currentCh);
        if (active) setTimeout(function(){ active.scrollIntoView({block:'nearest',behavior:'smooth'}); }, 50);
    }

    function jumpToChapter(ch) {
        currentQuestion = chapterIndex[ch].firstIdx;
        loadQuestion();
        closeChapterModal();
    }

    function openChapterModal() {
        buildChapterGrid();
        document.getElementById('chSearch').value = '';
        document.getElementById('chapterModal').classList.add('open');
    }

    function closeChapterModal() {
        document.getElementById('chapterModal').classList.remove('open');
    }

    function filterChapters(query) {
        var q = query.toLowerCase().trim();
        document.querySelectorAll('.ch-card').forEach(function(card) {
            card.classList.toggle('hidden', q !== '' && !card.getAttribute('data-name').includes(q));
        });
    }

    document.getElementById('chapterModal').addEventListener('click', function(e) {
        if (e.target === this) closeChapterModal();
    });

    document.addEventListener('keydown', function(e) {
        if (document.getElementById('chapterModal').classList.contains('open')) {
            if (e.key === 'Escape') closeChapterModal();
            return;
        }
        if (e.key >= '1' && e.key <= '5') {
            var idx = parseInt(e.key) - 1;
            if (idx < questions[currentQuestion].opts.length) selectOption(idx);
        } else if (e.key >= 'a' && e.key <= 'e') { selectOption(e.key.charCodeAt(0) - 97);
        } else if (e.key >= 'A' && e.key <= 'E') { selectOption(e.key.charCodeAt(0) - 65);
        } else if (e.key === 'ArrowLeft' && !document.getElementById('prevBtn').disabled) { previousCard();
        } else if (e.key === 'ArrowRight' && !document.getElementById('nextBtn').disabled) { nextCard();
        } else if (e.key === 'Escape' && document.getElementById('cancelBtn').classList.contains('show')) { cancelSelection();
        } else if (e.key === 'r' || e.key === 'R') { randomCard();
        } else if (e.key === 's' || e.key === 'S') { skipQuestion();
        }
    });

    function loadQuestion() {
        var q = questions[currentQuestion];
        if (!q) return;
        selectedOptions = [];
        answered = false;
        document.getElementById('chapterName').textContent = 'Ch ' + q.chapter + ': ' + q.chapName;
        document.getElementById('qTypeBadge').textContent = isMultiSelect(q) ? 'Multiple' : 'Single';
        document.getElementById('questionNumber').textContent = q.displayNumber;
        document.getElementById('question').textContent = q.q;
        document.getElementById('counter').textContent = (currentQuestion + 1) + '/' + questions.length;
        document.getElementById('rationale').classList.remove('show');
        document.getElementById('resultTag').innerHTML = '';
        document.getElementById('resultTag').className = 'result-tag';
        document.getElementById('cancelBtn').classList.remove('show');
        document.getElementById('nextBtn').disabled = true;
        document.getElementById('prevBtn').disabled = currentQuestion === 0;
        var pct = ((currentQuestion + 1) / questions.length * 100).toFixed(1);
        document.getElementById('progressBar').style.width = pct + '%';
        var container = document.getElementById('options');
        container.innerHTML = '';
        q.opts.forEach(function(opt, i) {
            var div = document.createElement('div');
            div.className = 'option';
            div.innerHTML = '<div class="option-letter">' + String.fromCharCode(65 + i) + '</div><div>' + opt + '</div>';
            div.onclick = (function(idx){ return function(){ selectOption(idx); }; })(i);
            container.appendChild(div);
        });
        updateSelectedCount();
        document.getElementById('questionArea').scrollTop = 0;
    }

    window.previousCard = previousCard;
    window.nextCard = nextCard;
    window.skipQuestion = skipQuestion;
    window.cancelSelection = cancelSelection;
    window.randomCard = randomCard;
    window.openChapterModal = openChapterModal;
    window.closeChapterModal = closeChapterModal;
    window.filterChapters = filterChapters;

    loadQuestion();
})();
</script>
</body>
</html>
